      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          echo "Testing EC2 connectivity..."

          nc -vz -w 10 "$EC2_HOST" 22

          echo "Retrieving EC2 SSH host key..."

          ssh-keyscan -T 10 -H "$EC2_HOST" >> ~/.ssh/known_hosts

          echo "SSH configuration completed!"