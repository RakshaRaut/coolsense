# Start with ./run.sh and stop with ./stop.sh. There are no restart policies,
# so nothing starts on its own after a reboot or a Docker restart.
services:
  database:
    image: postgres:16
    container_name: coolsense-db

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coolsense_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coolsense_password}
      POSTGRES_DB: ${POSTGRES_DB:-coolsense_db}

    ports:
      - "${POSTGRES_PORT:-5434}:5432"

    volumes:
      - coolsense_postgres_data:/var/lib/postgresql/data

    # Probe every second while starting, then only every 30s.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile

    container_name: coolsense-backend
    # tini as PID 1: reaps processes orphaned by the nest watcher and forwards signals.
    init: true

    ports:
      - "${BACKEND_PORT:-3000}:3000"

    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://${POSTGRES_USER:-coolsense_user}:${POSTGRES_PASSWORD:-coolsense_password}@database:5432/${POSTGRES_DB:-coolsense_db}?schema=public}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      TELEMETRY_INTERVAL_MS: ${TELEMETRY_INTERVAL_MS:-5000}
      TELEMETRY_RETENTION_DAYS: ${TELEMETRY_RETENTION_DAYS:-365}
      THINGSBOARD_ENABLED: ${THINGSBOARD_ENABLED:-false}
      THINGSBOARD_URL: ${THINGSBOARD_DOCKER_URL:-http://host.docker.internal:18080}
      THINGSBOARD_TENANT_ID: ${THINGSBOARD_TENANT_ID:-}
      THINGSBOARD_USER_ID: ${THINGSBOARD_USER_ID:-}
      THINGSBOARD_USERNAME: ${THINGSBOARD_USERNAME:-}
      THINGSBOARD_PASSWORD: ${THINGSBOARD_PASSWORD:-}

    depends_on:
      database:
        condition: service_healthy

    # Only source and schema are mounted, for hot reload. node_modules and
    # dist stay in the container, so there is no anonymous volume to go stale.
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma

    extra_hosts:
      - "host.docker.internal:host-gateway"

    # busybox wget is far lighter than spawning node for every probe.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile

    container_name: coolsense-frontend
    init: true

    ports:
      - "${FRONTEND_PORT:-5173}:5173"

    environment:
      VITE_PROXY_TARGET: http://backend:3000

    depends_on:
      backend:
        condition: service_healthy

volumes:
  coolsense_postgres_data:
