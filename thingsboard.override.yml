# Applied by run.sh and stop.sh on top of ~/Desktop/pulseGrid/docker-compose.yml.
# CoolSense starts only ThingsBoard and its database from that project.
services:
  thingsboard:
    restart: "no"
    environment:
      # thingsboard.conf appends its own flags to this. Without -Xmx the JVM
      # may grow to 25% of host RAM.
      JAVA_OPTS: "-Xms256m -Xmx768m -XX:G1PeriodicGCInterval=30000"

  thingsboard-db:
    restart: "no"
